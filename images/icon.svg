<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <path id="arm" d="M4,58 L40,58 C50,58 59,54 59,44 L57,24 C61,20 61,9 55,5.5 C50,2.5 42,2.8 37.5,5.2 C34.5,6 34,9 35.6,10.2 C33.4,10.8 33.3,13.8 35.4,14.5 C33.5,15.3 33.9,18.4 36.4,18.9 C38,20.6 40.5,21.5 43,21.5 C43,28 42,33 40,38 C38,29 31,22.5 23,23.5 C15,24.5 9,31 6,38 L4,39.5 Z"/>
    <clipPath id="armClip"><use href="#arm"/></clipPath>
    <linearGradient id="haki" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b4163"/>
      <stop offset="0.5" stop-color="#15121c"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>

  <!-- Skin at the shoulder end -->
  <use href="#arm" fill="#f1c09a"/>

  <!-- Armament Haki coating, with a wavy edge where it wraps the upper arm -->
  <g clip-path="url(#armClip)">
    <path fill="url(#haki)" d="M15,20 C12,28 17,33 13,40 C10,46 16,51 13,60 L64,60 L64,0 L15,0 Z"/>
    <!-- Fist: finger creases and thumb -->
    <g fill="none" stroke="#7a7090" stroke-width="1.1" stroke-linecap="round">
      <path d="M35.6,10.2 C37.5,10 39.5,10.2 41,10.8"/>
      <path d="M35.4,14.5 C37.3,14.4 39.2,14.6 40.6,15.2"/>
      <path d="M38.5,6.2 C44,5.6 47.5,8.5 46.6,12.6 C46.1,14.8 43.8,15.8 41.2,15.4"/>
    </g>
    <!-- Glossy highlights -->
    <g fill="none" stroke="#ffffff" stroke-linecap="round">
      <path d="M18.5,29.5 C22.5,26.8 27.5,26.2 31.5,28.2" stroke-width="2.4" stroke-opacity="0.9"/>
      <path d="M55.6,28 L56.4,39" stroke-width="1.8" stroke-opacity="0.55"/>
      <path d="M48.5,5.6 C51,5.8 53.5,7 55,8.8" stroke-width="1.8" stroke-opacity="0.8"/>
    </g>
  </g>

  <!-- Outline -->
  <use href="#arm" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
</svg>
