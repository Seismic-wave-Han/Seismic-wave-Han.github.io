<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <path id="arm" d="M4,58 L44,58 C51.5,58 56.5,54 57,47.5 C57.4,40 56.2,32 53.6,26.5 C55.6,24 56.2,20 56,16 C55.8,11.5 54.6,9 51.6,8.4 C47,7.6 42.5,7.6 39.4,8.4 C37.2,9 36.6,10.6 36.6,12.6 L36.7,15.2 C35.8,16 35.8,18.6 37.2,19.4 C37.6,21.4 38.8,22.6 40.2,23.2 C40.9,24 41.1,25.2 41,26.5 C41,32 40.4,37.5 39,42 C35,40.5 29,40.3 23,41 C15,42 9,43 4,44 Z"/>
    <clipPath id="armClip"><use href="#arm"/></clipPath>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3344"/>
      <stop offset="0.45" stop-color="#11141c"/>
      <stop offset="1" stop-color="#030305"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a9d2ff"/>
    </linearGradient>
  </defs>

  <!-- Bare skin at the shoulder end -->
  <use href="#arm" fill="#f1c09a"/>

  <g clip-path="url(#armClip)">
    <!-- Armament Haki: metallic coat with a jagged edge -->
    <path fill="url(#metal)" d="M18,36 L13,42 L17,44 L11,48.5 L16,50.5 L11.5,55 L16,57 L13,60 L64,60 L64,0 L18,0 Z"/>

    <!-- Thumb wrapped over the fingers, and a faint forearm muscle line -->
    <g fill="none" stroke="#5a6580" stroke-width="1" stroke-linecap="round">
      <path d="M37,15.4 C40.5,14.6 45,15.4 49.5,18.6"/>
      <path d="M37.6,19.6 C40.5,19.6 43.5,20.4 46.5,22"/>
      <path d="M45,46 C44.2,39.5 44.8,34 46.8,29.5" stroke="#46506a" stroke-opacity="0.6"/>
    </g>

    <!-- Metallic highlights -->
    <g fill="url(#shine)">
      <path d="M41,9.6 C45.5,8.2 50.5,8.4 53.8,11.2 C50.3,10.2 45.8,10.2 42,11 Z"/>
      <path d="M39.6,16.6 C42.4,16.2 45.2,16.7 47.6,18.2 C45,17.7 42.4,17.6 40,17.8 Z"/>
      <path d="M52,30 C54,36 54.6,42 54,48 C52.6,42.5 51.6,36.5 50.8,30.6 Z"/>
      <path d="M20,43.8 C25,42.8 30,42.8 33.5,43.6 C29.5,43.9 25,44.5 20.8,45.4 Z"/>
    </g>
    <path d="M49.5,56.2 C53.2,55 55.2,52 55.6,48.6" fill="none" stroke="#a9d2ff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.5"/>
  </g>

  <!-- Outline -->
  <use href="#arm" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
